[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-decision-engine"
version = "0.1.0"
description = "A question-conditioned decision model with typed probability outputs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tokenization = ["transformers>=4.40,<5"]
model = ["torch>=2.2", "transformers>=4.40,<5", "safetensors>=0.4.3"]

[project.scripts]
decision-engine = "decision_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
